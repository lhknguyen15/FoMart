# SQL Server cho môi trường phát triển FoMart.
#   docker compose up -d                 # chạy
#   ./database/migrate.ps1 -Docker -Seed # dựng database FoMart trong container
# Mật khẩu SA và cổng lấy từ file .env (không commit; mẫu ở .env.example).
name: fomart

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fomart-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Chua dat MSSQL_SA_PASSWORD trong .env}
      # Collation cấp server = collation của database FoMart, nên tempdb (#temp) cũng khớp (ADR-0002 mục 7).
      MSSQL_COLLATION: Latin1_General_100_CI_AI
      TZ: Etc/UTC
    ports:
      - "${MSSQL_PORT:-14330}:1433"   # 14330 để không đụng SQL Server cài trên Windows
    volumes:
      - fomart-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  fomart-sqldata:
